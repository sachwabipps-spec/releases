name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Décompresser la dernière version
        run: |
          ZIP=$(ls GamingSoul-source-*.zip | sort -V | tail -1)
          echo "Zip utilisé : $ZIP"
          unzip -q "$ZIP"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: NexusGames
        run: gradle assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp NexusGames/app/build/outputs/apk/debug/*.apk gaming-soul.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gaming-soul
          path: gaming-soul.apk
